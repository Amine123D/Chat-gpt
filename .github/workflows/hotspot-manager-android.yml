name: Build Hotspot Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - "hotspot-manager/**"
      - ".github/workflows/hotspot-manager-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotspot-manager
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hotspot-manager-debug-apk
          path: hotspot-manager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
